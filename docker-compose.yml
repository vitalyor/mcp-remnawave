services:
  remnawave-mcp:
    build: .
    ports:
      - "3100:3100"
    environment:
      - REMNAWAVE_BASE_URL=${REMNAWAVE_BASE_URL}
      - REMNAWAVE_API_TOKEN=${REMNAWAVE_API_TOKEN}
      - REMNAWAVE_API_KEY=${REMNAWAVE_API_KEY:-}
      - REMNAWAVE_MODE=${REMNAWAVE_MODE:-full}
      - REMNAWAVE_TOOLS=${REMNAWAVE_TOOLS:-}
    restart: unless-stopped
